name: Cumulative regression

on:
  push:
    branches:
      - development
      - codex/ci-regression
      - 'codex/release-candidate/**'
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Static build and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Check capacity and build isolation
        run: |
          bash tests/ci/runner-preflight.sh 3
          git diff --check HEAD^ HEAD
          for script in app.js contact.js preview/client.js scripts/build.mjs; do
            node --check "$script"
          done
          node --test tests/build-isolation.test.mjs tests/contact-handler.test.mjs
          VERCEL_ENV=production VERCEL_GIT_COMMIT_REF=main node scripts/build.mjs
          node scripts/build.mjs
      - name: Install pinned Playwright package
        timeout-minutes: 3
        run: npm ci --prefix tests/ci --no-audit --no-fund
      - name: Install pinned Chromium on the standard runner image
        timeout-minutes: 3
        run: tests/ci/node_modules/.bin/playwright install --only-shell chromium
      - name: Run all browser regressions
        timeout-minutes: 6
        run: |
          export NODE_PATH="$PWD/tests/ci/node_modules"
          for suite in tests/*.browser.cjs; do
            node "$suite"
          done

  recovery:
    name: Database regression and synthetic recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.11.1'
          package-manager-cache: false
      - name: Run database and GPG recovery checks
        run: |
          bash tests/ci/runner-preflight.sh 4
          python3 --version
          gpg --version | head -n 1
          bash tests/ci/postgres-fixture.sh rated420-averages-pg postgres
          node --test tests/community-db.test.mjs
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  storage:
    name: Isolated Supabase Storage API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run Storage HTTP and ownership checks
        run: |
          bash tests/ci/runner-preflight.sh 5
          bash tests/ci/storage-fixture.sh
